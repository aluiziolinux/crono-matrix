<div id="models-panel" hx-swap-oob="innerHTML">{% include "partials/models.html" %}</div>
<section id="model-detail" hx-swap-oob="innerHTML">{% include "partials/model_detail.html" %}</section>
<div id="parameters-panel" hx-swap-oob="innerHTML">{% include "partials/parameters.html" %}</div>
<strong id="rail-model-name" hx-swap-oob="innerHTML">{{ model.name if model else 'NENHUM MODELO' }}</strong>
<div id="notice-region" hx-swap-oob="innerHTML">
  {% if error %}<div class="notice error">{{ error }}</div>{% else %}<div class="notice success">Modelo selecionado. Metadados reutilizados quando disponíveis.</div>{% endif %}
</div>
